# Serves the built SPA and falls back every unmatched path to index.html
# so React Router's client-side routes (e.g. /contacts, /analytics)
# work on a hard refresh or direct link, not just client-side navigation.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
